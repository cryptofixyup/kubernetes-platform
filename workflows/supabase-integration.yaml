name: supabase-integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  integration:
    runs-on: supabase-runners
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: npm ci

      - name: Confirm Docker daemon
        run: |
          docker version
          docker info

      - name: Start Supabase services
        run: supabase start -x studio,inbucket,imgproxy

      - name: Run integration tests
        run: npm run test:integration --if-present

      - name: Collect service state on failure
        if: failure()
        run: |
          docker ps -a
          supabase status

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-diagnostics
          path: supabase/.temp
          if-no-files-found: ignore

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true
